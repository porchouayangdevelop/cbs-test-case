version: "3.8"
services:
  nodejs1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodejs1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - app-network
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://nodejs1:3000/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5

  nodejs2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodejs2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - app-network
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://nodejs2:3000/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - nodejs1
      - nodejs2
    networks:
      - app-network
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - app-network

volumes:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
