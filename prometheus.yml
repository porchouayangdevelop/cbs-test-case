global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
- job_name: 'nodejs'
  static_configs:
  - targets: [ 'nodejs1:3000', 'nodejs2:3001' ]
    labels:
      group: 'production'

- job_name: 'nginx'
  static_configs:
  - targets: [ 'nginx:80' ]
    labels:
      group: 'production'
